    function workspaceCardDate(card, eventMap) {
      const event = eventMap.get(card.human_event_id);
      return event?.occurred_at || card.occurred_at || card.created_at || "";
    }

    function workspaceSummaryPointsFrom(values, fallbackText = "", maxItems = 3) {
      const clean = (value) => String(value || "")
        .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
        .replace(/^#{1,6}\s+/gm, "")
        .replace(/^[*-]\s+/gm, "")
        .replace(/^\d+[.)]\s+/gm, "")
        .replace(/[*_`>]/g, "")
        .replace(/\s+/g, " ")
        .trim();
      const points = (Array.isArray(values) ? values : (values ? [values] : [])).map(clean).filter(Boolean);
      if (points.length) return [...new Set(points)].slice(0, maxItems);
      const fallback = String(fallbackText || "")
        .replace(/^#\s+[^\n]+\n?/, "")
        .split(/\r?\n/)
        .map(clean)
        .find(Boolean);
      return fallback ? [fallback] : [];
    }

    function workspaceSummaryPoints(card) {
      return workspaceSummaryPointsFrom(card?.key_points, card?.summary || card?.excerpt || card?.content_excerpt || card?.card_text || "", 3).length
        ? workspaceSummaryPointsFrom(card?.key_points, card?.summary || card?.excerpt || card?.content_excerpt || card?.card_text || "", 3)
        : ["暂无总结"];
    }

    function workspaceCardRelation(card) {
      const topic = workspaceTopicMap(workspaceIndex || {}).get(card?.topic_id || "");
      const event = workspaceEventMap(workspaceIndex || {}).get(card?.human_event_id || "");
      const placementType = String(card?.placement_type || "").toLowerCase();
      if ((card?.card_type === "task" || card?.task_id || placementType === "topic" || (!card?.human_event_id && card?.topic_id)) && (topic || card?.topic_id)) {
        return { label: "项目议题", title: topic?.title || card.topic_id };
      }
      if (event || card?.human_event_id || placementType === "human_event") {
        return { label: "交流记录", title: event?.title || card.human_event_id || "未关联交流记录" };
      }
      if (topic || card?.topic_id) return { label: "项目议题", title: topic?.title || card.topic_id };
      return { label: "未关联", title: "未关联内容" };
    }

    function workspaceTopicTitleFor(card) {
      return workspaceCardRelation(card).title;
    }

    function workspaceSourceUrl(value) {
      const ref = String(value || "");
      if (ref.startsWith("/collaborate/")) return ref;
      if (ref.startsWith("01-raw/") || ref.startsWith("05-agent-outputs/") || ref.startsWith("08-cards/") || ref.startsWith("09-tasks/")) return "/collaborate/" + ref.split("/").map(encodeURIComponent).join("/");
      return /^https?:\/\//.test(ref) ? ref : "#";
    }

    function workspaceRawSourceButton(event) {
      const refs = (Array.isArray(event?.source_refs) ? event.source_refs : [])
        .map((item) => String(item || ""));
      const supported = /\.(?:txt|md|markdown|pdf|docx|pptx|xlsx|xls|msg|html?|csv|json|xml)$/i;
      const ref = refs.find((item) => item.startsWith("01-raw/") && supported.test(item))
        || refs.find((item) => supported.test(item));
      if (!ref) return "";
      const url = workspaceSourceUrl(ref);
      if (url === "#") return "";
      const filename = ref.split("/").pop() || "原始记录";
      return `<a class="copy-id aggregate-source-button" href="${workspaceEscape(url)}" download="${workspaceEscape(filename)}" title="下载原始记录">原始记录</a>`;
    }

    function workspaceEventHasConverged(event) {
      return ["final", "incomplete"].includes(String(event?.summary_status || "").toLowerCase())
        || Boolean(event?.summary_generated_at && event?.finalization_reason);
    }

    function workspaceConfirmedTopicsForEvent(index, event) {
      const topics = workspaceTopics(index);
      const eventId = workspaceEventId(event);
      const ids = new Set(Array.isArray(event?.topic_ids) ? event.topic_ids : []);
      if (ids.size) return topics.filter((topic) => ids.has(workspaceTopicId(topic)));
      if (!workspaceEventHasConverged(event)) return [];
      return topics.filter((topic) => (topic.human_event_ids || []).includes(eventId));
    }

    function workspaceConfirmedTasksForEvent(index, event) {
      const ids = new Set(Array.isArray(event?.task_ids) ? event.task_ids : []);
      if (!ids.size || !workspaceEventHasConverged(event)) return [];
      return workspaceTasks(index).filter((task) => ids.has(task.task_id));
    }

    function workspaceSourceLinks(refs) {
      return (Array.isArray(refs) ? refs : []).map((ref) => {
        const url = workspaceSourceUrl(ref);
        return url === "#" ? "" : `<a class="workspace-detail-source" href="${workspaceEscape(url)}" target="_blank" rel="noopener">${workspaceEscape(ref)}</a>`;
      }).filter(Boolean).join("<br>");
    }

    function workspaceCardButton(card, eventMap) {
      const event = eventMap.get(card.human_event_id);
      const date = workspaceDateLabel(workspaceCardDate(card, eventMap));
      const points = workspaceSummaryPoints(card);
      const people = (card.participants || []).join(" / ") || "未标注参与人";
      const taskRecord = card.task_id && workspaceIndex ? workspaceTasks(workspaceIndex).find((task) => task.task_id === card.task_id) : null;
      const isTaskCard = card.card_type === "task" || Boolean(card.task_id);
      const cardIdLabel = isTaskCard ? "Task卡片ID" : "Personal卡片ID";
        const relation = workspaceCardRelation(card);
      const cardId = workspaceEscape(card.card_id || "");
      return `<article class="card-thumbnail" role="button" tabindex="0" data-card-id="${cardId}" aria-label="查看详细卡片：${workspaceEscape(card.title || cardId)}" onclick="workspaceOpenCard(this.dataset.cardId,this)" onkeydown="workspaceHandleCardKey(event,this)">
        <div class="thumbnail-layout">
          <aside class="thumbnail-side" aria-label="卡片日期与提交者">
            <span class="thumbnail-date">${workspaceEscape(date)}</span>
            <span class="thumbnail-submitter"><span class="thumbnail-submitter-label">提交者</span><span class="thumbnail-submitter-value">${workspaceEscape(card.author || "未标注")}</span></span>
          </aside>
          <div class="thumbnail-main">
            <div class="thumbnail-head">
              <h3 class="thumbnail-title">${workspaceEscape(card.title || card.card_id || "未命名卡片")}</h3>
              <span class="thumbnail-actions">
                <button class="copy-id" type="button" data-copy-id="${cardId}" onclick="workspaceCopyId(this.dataset.copyId,event)" aria-label="复制${cardIdLabel}">${cardIdLabel}</button>
                <span class="thumbnail-arrow" aria-hidden="true"></span>
              </span>
            </div>
            ${isTaskCard ? "" : `<ul class="thumbnail-points">${points.map((point) => `<li>${workspaceEscape(point)}</li>`).join("")}</ul>`}
            <div class="thumbnail-meta">
              <span class="thumbnail-meta-item"><span class="thumbnail-meta-label">${workspaceEscape(relation.label)}</span><span class="thumbnail-meta-value">${workspaceEscape(relation.title)}</span></span>
              <span class="thumbnail-meta-item"><span class="thumbnail-meta-label">参与人</span><span class="thumbnail-meta-value">${workspaceEscape(people)}</span></span>
              ${taskRecord ? `<span class="thumbnail-meta-item"><span class="thumbnail-meta-label">状态</span><span class="thumbnail-meta-value">${workspaceEscape(workspaceTaskStatus(taskRecord))}</span></span>` : ""}
            </div>
          </div>
        </div>
      </article>`;
    }

    function workspaceMonthHasCards(year, month) {
      return workspaceTimelineGroups.some((group) => group.year === year && group.month === month);
    }

    function workspaceSetActiveNav(year, month) {
      workspaceActiveYear = year;
      workspaceActiveMonth = month;
      document.querySelectorAll("#archiveNav .nav-option[data-year]").forEach((button) => {
        button.classList.toggle("active", button.dataset.year === workspaceActiveYear && !button.dataset.month);
      });
      document.querySelectorAll("#archiveNav .nav-option[data-month]").forEach((button) => {
        button.classList.toggle("active", button.dataset.year === workspaceActiveYear && button.dataset.month === workspaceActiveMonth);
      });
    }

    function workspaceScrollContainerTo(container, target) {
      if (!container || !target) return;
      const top = target.getBoundingClientRect().top - container.getBoundingClientRect().top + container.scrollTop;
      container.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    }

    function workspaceScrollToMonth(year, month) {
      const section = document.getElementById(`month-${year}-${month}`);
      const container = document.getElementById("timelineViewport");
      if (!section || !container) return;
      workspaceSetActiveNav(year, month);
      workspaceScrollContainerTo(container, section);
    }

    function workspaceRenderNavigation(groups) {
      const host = document.getElementById("archiveNav");
      if (!groups.length) {
        host.innerHTML = '<span class="nav-option">暂无卡片</span>';
        return;
      }
      workspaceTimelineGroups = groups;
      workspaceActiveYear = groups[0].year;
      workspaceActiveMonth = groups[0].month;
      const years = [...new Set(groups.map((group) => group.year))].sort((a, b) => b.localeCompare(a));
      const yearButtons = years.map((year) => {
        const total = groups.filter((group) => group.year === year).reduce((sum, group) => sum + group.cards.length, 0);
        return `<button class="nav-option" type="button" data-year="${workspaceEscape(year)}"><span>${workspaceEscape(year)}</span><span class="count">${total}</span></button>`;
      }).join("");
      const monthButtons = Array.from({ length: 12 }, (_, index) => {
        const month = String(index + 1).padStart(2, "0");
        const count = groups.find((group) => group.year === workspaceActiveYear && group.month === month)?.cards.length || 0;
        return `<button class="nav-option ${count ? "" : "is-empty"}" type="button" data-year="${workspaceEscape(workspaceActiveYear)}" data-month="${month}"><span>${index + 1}</span><span class="count">${count || ""}</span></button>`;
      }).join("");
      host.innerHTML = `<div class="nav-columns"><div class="nav-column"><div class="nav-label">年</div><div class="nav-list">${yearButtons}</div></div><div class="nav-column"><div class="nav-label">月</div><div class="nav-list">${monthButtons}</div></div></div>`;
      host.querySelectorAll(".nav-option[data-year]:not([data-month])").forEach((button) => button.addEventListener("click", () => {
        const firstGroup = workspaceTimelineGroups.find((group) => group.year === button.dataset.year);
        if (firstGroup) workspaceScrollToMonth(firstGroup.year, firstGroup.month);
      }));
      host.querySelectorAll(".nav-option[data-month]").forEach((button) => button.addEventListener("click", () => {
        if (workspaceMonthHasCards(button.dataset.year, button.dataset.month)) workspaceScrollToMonth(button.dataset.year, button.dataset.month);
      }));
      workspaceSetActiveNav(workspaceActiveYear, workspaceActiveMonth);
    }

    function workspaceHandleCardKey(event, card) {
      if (event.target !== card) return;
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      workspaceOpenCard(card.dataset.cardId, card);
    }

    function workspaceRenderTimeline(index) {
      const cards = workspaceCards(index);
      const eventMap = workspaceEventMap(index);
      const host = document.getElementById("dynamicFeed");
      document.getElementById("workspaceCardCount").textContent = String(cards.length);
      document.getElementById("workspaceTopicCount").textContent = String(workspaceTopics(index).length);
      if (!cards.length) {
        host.className = "workspace-timeline loading";
        host.textContent = "还没有可展示卡片。";
        return;
      }
      const sorted = [...cards].sort((a, b) => new Date(workspaceCardDate(b, eventMap)) - new Date(workspaceCardDate(a, eventMap)));
      const groups = new Map();
      sorted.forEach((card) => {
        const date = workspaceDate(workspaceCardDate(card, eventMap));
        const key = `${date.year}-${date.month}`;
        if (!groups.has(key)) groups.set(key, { year: date.year, month: date.month, cards: [] });
        groups.get(key).cards.push(card);
      });
      const grouped = [...groups.values()];
      workspaceRenderNavigation(grouped);
      host.className = "workspace-timeline";
      host.innerHTML = grouped.map((group) => `<section class="month-section" id="month-${group.year}-${group.month}" data-year="${workspaceEscape(group.year)}" data-month="${workspaceEscape(group.month)}"><h2 class="month-title">${workspaceEscape(group.year)} 年 ${workspaceEscape(Number(group.month))}月</h2><div class="card-stack">${group.cards.map((card) => workspaceCardButton(card, eventMap)).join("")}</div></section>`).join("");
      if (workspaceScrollObserver) workspaceScrollObserver.disconnect();
      const timelineViewport = document.getElementById("timelineViewport");
      if (typeof IntersectionObserver === "function") {
        workspaceScrollObserver = new IntersectionObserver((entries) => {
          const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
          if (!visible) return;
          workspaceSetActiveNav(visible.target.dataset.year, visible.target.dataset.month);
        }, { root: timelineViewport, rootMargin: "-20px 0px -65% 0px", threshold: [0, .3, .7] });
        document.querySelectorAll(".month-section").forEach((section) => workspaceScrollObserver.observe(section));
      }
    }

    function workspaceRenderPersonalCards(cards, eventMap, emptyText) {
      return cards.length ? `<div class="workspace-card-stack">${cards.map((card) => workspaceCardButton(card, eventMap)).join("")}</div>` : `<div class="aggregate-empty">${workspaceEscape(emptyText)}</div>`;
    }

    function workspaceAggregateHeader(title, summary, metadata, id, extraAction = "", summaryExtra = "") {
      const points = Array.isArray(summary) ? summary : workspaceSummaryPointsFrom([], summary, 3);
      const summaryMarkup = points.length
        ? `<ul class="aggregate-summary-points">${points.map((point) => `<li>${workspaceEscape(point)}</li>`).join("")}</ul>`
        : "";
      return `<summary><span class="aggregate-header-content"><span class="aggregate-title-row"><strong>${workspaceEscape(title)}</strong></span>${summaryMarkup}${summaryExtra}<span class="aggregate-meta">${metadata}</span></span><span class="aggregate-actions">${extraAction}<button class="copy-id" type="button" data-copy-id="${workspaceEscape(id)}" onclick="workspaceCopyId(this.dataset.copyId,event)" aria-label="复制 ID">${workspaceEscape(id ? "ID" : "")}</button><span class="aggregate-chevron" aria-hidden="true"></span></span></summary>`;
    }

    function workspaceRenderHumanEvents(index) {
      const events = workspaceEvents(index);
      const cards = workspaceCards(index).filter((card) => card.card_type !== "task" && !card.task_id);
      const topics = workspaceTopics(index);
      const eventMap = workspaceEventMap(index);
      const host = document.getElementById("humanEventsContainer");
      host.className = "aggregate-list";
      host.innerHTML = events.length ? events.sort((a, b) => new Date(b.occurred_at || b.created_at) - new Date(a.occurred_at || a.created_at)).map((event) => {
        const eventId = workspaceEventId(event);
        const eventCards = cards.filter((card) => card.human_event_id === eventId);
        const eventTopics = workspaceConfirmedTopicsForEvent(index, event);
        const eventTasks = workspaceConfirmedTasksForEvent(index, event);
        const converged = workspaceEventHasConverged(event);
        const summary = workspaceSummaryPointsFrom(event.key_points, event.summary || event.current_summary || event.description || "", 3);
        const collectionStatus = converged ? (event.summary_status === "incomplete" ? "已到期 · 不完整" : "已收敛") : "等待收敛";
        const metadata = `<span>${workspaceEscape(workspaceDateLabel(event.occurred_at || event.created_at))}</span><span>${workspaceEscape((event.participants || []).join(" / ") || "未标注参与人")}</span><span>${eventCards.length} 张 Personal Card · ${collectionStatus}</span>`;
        const topicMarkup = eventTopics.length ? eventTopics.map((topic) => `<a class="topic-link" href="#topic-${encodeURIComponent(workspaceTopicId(topic))}">${workspaceEscape(topic.title || workspaceTopicId(topic))}</a>`).join("") : `<span class="aggregate-empty">${converged ? "暂无已确认项目议题" : "收敛后显示项目议题"}</span>`;
        const taskMarkup = eventTasks.length ? eventTasks.map((task) => `<button class="topic-link task-link" type="button" onclick="workspaceOpenTaskFromPlan('${workspaceEscape(task.task_id)}',event)">${workspaceEscape(task.title || task.task_id)} · ${workspaceEscape(workspaceTaskStatus(task))}</button>`).join("") : `<span class="aggregate-empty">${converged ? "暂无已确认任务" : "收敛后显示确认任务"}</span>`;
        const sourceButton = workspaceRawSourceButton(event);
        return `<details class="aggregate-card" id="human-event-${workspaceEscape(eventId)}">${workspaceAggregateHeader(event.title || eventId || "未命名交流记录", summary, metadata, eventId, sourceButton)}<div class="aggregate-body"><section class="aggregate-section"><h3>项目议题</h3><div class="topic-links">${topicMarkup}</div></section><section class="aggregate-section"><h3>确认任务</h3><div class="topic-links">${taskMarkup}</div></section><section class="aggregate-section"><h3>Personal Cards</h3>${workspaceRenderPersonalCards(eventCards, eventMap, "该交流记录暂无 Personal Card")}</section></div></details>`;
      }).join("") : `<div class="empty-state">还没有可展示交流记录。</div>`;
    }

    function workspaceRenderTopics(index) {
      const topics = workspaceTopics(index);
      const events = workspaceEventMap(index);
      const cards = workspaceCards(index);
      const host = document.getElementById("topicsContainer");
      host.className = "aggregate-list";
      host.innerHTML = topics.length ? topics.map((topic) => {
        const topicId = workspaceTopicId(topic);
        const relatedEvents = (topic.human_event_ids || []).map((id) => events.get(id)).filter(Boolean);
        const topicPersonalCards = cards.filter((card) => card.topic_id === topicId && card.card_type !== "task" && !card.task_id);
        const topicCards = cards.filter((card) => card.topic_id === topicId && (card.card_type === "task" || card.task_id));
        const topicTasks = workspaceTasksForTopic(index, topic);
        const briefing = workspaceBriefingForTopic(index, topic);
        const summary = workspaceSummaryPointsFrom(topic.key_points, topic.current_summary || topic.summary || "", 3);
        const date = relatedEvents[0]?.occurred_at || topic.updated_at || topic.created_at;
        const people = [...new Set(relatedEvents.flatMap((event) => event.participants || []))].join(" / ") || "未标注参与人";
        const metadata = `<span>${workspaceEscape(workspaceDateLabel(date))}</span><span>${workspaceEscape(people)}</span><span>${relatedEvents.length} 个交流记录 · ${topicTasks.length} 个 Task</span>`;
        const taskMarkup = topicTasks.length ? topicTasks.map((task) => {
          const taskCard = topicCards.find((card) => card.task_id === task.task_id || card.card_id === task.task_card_id);
          return taskCard ? workspaceCardButton(taskCard, events) : `<div class="plan-card"><h3>${workspaceEscape(task.title || task.task_id)}</h3><p>${workspaceEscape(task.content || task.done_criteria || "暂无任务说明")}</p><div class="card-meta"><span class="tag blue">${workspaceEscape(workspaceTaskStatus(task))}</span><span class="tag">${workspaceEscape(task.owner || "待确认负责人")}</span></div></div>`;
        }).join("") : `<div class="aggregate-empty">该 Topic 暂无 Task。</div>`;
        return `<details class="aggregate-card" id="topic-${workspaceEscape(topicId)}" data-topic-id="${workspaceEscape(topicId)}">${workspaceAggregateHeader(topic.title || topicId || "未命名项目议题", summary, metadata, topicId, "", workspaceBriefingHeaderMarkup(briefing))}<div class="aggregate-body">${briefing ? `<section class="aggregate-section"><h3>会前简报</h3><p class="aggregate-empty">${workspaceEscape(workspaceBriefingStatus(briefing))}</p></section>` : ""}<section class="aggregate-section"><h3>Personal Cards · ${topicPersonalCards.length}</h3>${workspaceRenderPersonalCards(topicPersonalCards, events, "该项目议题暂无 Personal Card")}</section><section class="aggregate-section"><h3>Tasks · ${topicTasks.length}</h3><div class="workspace-card-stack">${taskMarkup}</div></section></div></details>`;
      }).join("") : `<div class="empty-state">还没有可展示项目议题。</div>`;
    }

    function workspaceProfileMarkup(person) {
      return `<button class="profile-item" type="button" data-person="${workspaceEscape(person.name)}" onclick="workspaceOpenPerson(this.dataset.person,this)"><span class="profile-name">${workspaceEscape(person.name)}</span><span class="profile-kind">${workspaceEscape(person.kind)}</span><span class="profile-portrait">${workspaceEscape(person.portrait)}</span><span class="profile-counts"><span>${person.events.size} 个交流记录</span><span>${person.topics.size} 个项目议题</span><span>${person.tasks.size} 个 Task</span></span></button>`;
    }

    function workspaceRenderPeople(index) {
      const profiles = Object.fromEntries((index.people?.profiles || []).map((person) => [person.name, person]));
      const people = new Map(Object.entries(profiles).map(([name, profile]) => [name, { name, ...profile, events: new Set(), topics: new Set(), tasks: new Set() }]));
      const events = workspaceEventMap(index);
      const topics = workspaceTopics(index);
      const add = (name) => people.get(name === "Project Hermes" ? "Hermes" : name);
      workspaceEvents(index).forEach((event) => (event.participants || []).forEach((name) => add(name)?.events.add(workspaceEventId(event))));
      workspaceCards(index).forEach((card) => {
        const person = add(card.author);
        if (person && card.human_event_id) person.events.add(card.human_event_id);
        if (person && card.topic_id) person.topics.add(card.topic_id);
        (card.participants || []).forEach((name) => add(name)?.events.add(card.human_event_id));
      });
      topics.forEach((topic) => {
        const topicId = workspaceTopicId(topic);
        (topic.human_event_ids || []).forEach((eventId) => (events.get(eventId)?.participants || []).forEach((name) => add(name)?.topics.add(topicId)));
      });
      workspaceTasks(index).forEach((task) => {
        const person = add(task.owner);
        if (person) { person.tasks.add(task.task_id); if (task.topic_id) person.topics.add(task.topic_id); }
      });
      workspacePeople = people;
      workspacePeopleGraphData = {
        people: [...people.values()],
        edges: index.people?.edges || [],
      };
      const host = document.getElementById("peopleContainer");
      host.className = "people-layout";
      if (!["hierarchy", "expanded"].includes(workspacePeopleGraphView)) workspacePeopleGraphView = "hierarchy";
      host.innerHTML = '<section class="people-section"><div class="people-section-head"><h2>人物画像</h2><p>只展示项目中有来源的事实，不推断私人心理特征。</p></div><div class="profile-grid">' + [...people.values()].map(workspaceProfileMarkup).join("") + '</div></section><section class="people-section"><div class="people-section-head people-graph-head"><div><h2>人物关系图</h2><p>关系表示项目角色与个人 Agent 归属。</p></div><div class="graph-view-switch" role="group" aria-label="人物关系图视图"><button class="graph-view-option" type="button" data-graph-view="hierarchy" aria-pressed="' + String(workspacePeopleGraphView === "hierarchy") + '" onclick="workspaceSetPeopleGraphView(\'hierarchy\')">从上到下</button><button class="graph-view-option" type="button" data-graph-view="expanded" aria-pressed="' + String(workspacePeopleGraphView === "expanded") + '" onclick="workspaceSetPeopleGraphView(\'expanded\')">扩展视图</button></div></div><div class="people-graph" id="workspacePeopleGraph" aria-label="项目人物关系图"></div></section>';
      workspaceRenderKnowledgeGraph();
    }

    function workspacePersonInitials(name) {
      const words = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (words.length > 1) return words.map((word) => word[0]).join("").slice(0, 2).toUpperCase();
      return words[0]?.slice(0, 2).toUpperCase() || "?";
    }

    function workspaceGraphLineGeometry(from, to) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const length = Math.max(Math.hypot(dx, dy), 1);
      const targetOffset = 42;
      return { x1: from.x, y1: from.y, x2: to.x - (dx / length) * targetOffset, y2: to.y - (dy / length) * targetOffset };
    }

    function workspaceDrawKnowledgeGraph(force = false) {
      const host = document.getElementById("workspacePeopleGraph");
      if (!host || !workspacePeopleGraphData) return;
      const width = Math.max(Math.round(host.clientWidth || 0), 320);
      if (!force && width === workspacePeopleGraphWidth) return;
      workspacePeopleGraphWidth = width;
      const compact = width < 720;
      const hierarchy = workspacePeopleGraphView === "hierarchy";
      const height = compact ? 620 : 500;
      const positions = new Map();
      if (hierarchy) {
        positions.set("project", { x: width / 2, y: 62 });
        positions.set("Hermes", { x: width * .5, y: 210 });
        positions.set("Zac", { x: width * .2, y: 210 });
        positions.set("Vivi", { x: width * .8, y: 210 });
        positions.set("Zac Codex", { x: width * .2, y: 410 });
        positions.set("Vivi Codex", { x: width * .8, y: 410 });
      } else {
        if (compact) {
          positions.set("project", { x: width / 2, y: 88 });
          positions.set("Zac", { x: width * .19, y: 270 });
          positions.set("Hermes", { x: width / 2, y: 270 });
          positions.set("Vivi", { x: width * .81, y: 270 });
          positions.set("Zac Codex", { x: width * .2, y: 510 });
          positions.set("Vivi Codex", { x: width * .8, y: 510 });
        } else {
          positions.set("project", { x: width / 2, y: 245 });
          positions.set("Hermes", { x: width / 2, y: 72 });
          positions.set("Zac", { x: width * .25, y: 225 });
          positions.set("Vivi", { x: width * .75, y: 225 });
          positions.set("Zac Codex", { x: width * .1, y: 420 });
          positions.set("Vivi Codex", { x: width * .9, y: 420 });
        }
      }
      const links = workspacePeopleGraphData.edges.map((edge, index) => {
        const from = positions.get(edge.source);
        const to = positions.get(edge.target);
        if (!from || !to) return "";
        const line = workspaceGraphLineGeometry(from, to);
        const agent = edge.type === "personal-agent";
        const lineClass = agent ? "knowledge-agent-link" : "knowledge-project-link";
        const marker = agent ? "workspaceKnowledgeAgentArrow" : "workspaceKnowledgeProjectArrow";
        const label = compact || hierarchy ? "" : '<text class="knowledge-link-label" x="' + ((line.x1 + line.x2) / 2) + '" y="' + ((line.y1 + line.y2) / 2 - 8) + '">' + workspaceEscape(edge.label) + '</text>';
        return '<line class="' + lineClass + '" x1="' + line.x1 + '" y1="' + line.y1 + '" x2="' + line.x2 + '" y2="' + line.y2 + '" marker-end="url(#' + marker + ')" data-edge="' + index + '"></line>' + label;
      }).join("");
      const nodes = workspacePeopleGraphData.people.filter((person) => positions.has(person.name)).map((person) => {
        const point = positions.get(person.name);
        const typeClass = person.kind === "Agent" ? "agent" : (person.kind === "人类" ? "human" : "participant");
        const role = hierarchy ? workspacePeopleGraphData.edges.find((edge) => edge.target === person.name)?.label : "";
        const roleMarkup = role ? '<span class="knowledge-node-role">' + workspaceEscape(role) + '</span>' : "";
        return '<button class="knowledge-node ' + typeClass + '" type="button" style="left:' + point.x + 'px;top:' + point.y + 'px" data-person="' + workspaceEscape(person.name) + '" onclick="workspaceOpenPerson(this.dataset.person,this)" aria-haspopup="dialog" aria-label="查看 ' + workspaceEscape(person.name) + ' 的人物画像与关联内容"><span class="knowledge-node-avatar">' + workspaceEscape(workspacePersonInitials(person.name)) + '</span><span class="knowledge-node-name">' + workspaceEscape(person.name) + '</span>' + roleMarkup + '</button>';
      }).join("");
      const project = positions.get("project");
      const markers = '<defs><marker id="workspaceKnowledgeProjectArrow" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="7" markerHeight="7" orient="auto"><path class="knowledge-project-arrow" d="M0,0 L7,3.5 L0,7 Z"></path></marker><marker id="workspaceKnowledgeAgentArrow" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="7" markerHeight="7" orient="auto"><path class="knowledge-agent-arrow" d="M0,0 L7,3.5 L0,7 Z"></path></marker></defs>';
      host.style.height = height + "px";
      const projectTitle = String(window.workspaceProjectTitle || "项目 Workspace");
      const projectLines = projectTitle.length > 8 ? [projectTitle.slice(0, Math.ceil(projectTitle.length / 2)), projectTitle.slice(Math.ceil(projectTitle.length / 2))] : [projectTitle];
      host.innerHTML = '<svg class="people-graph-lines" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none" aria-hidden="true">' + markers + links + '</svg><div class="knowledge-node project" style="left:' + project.x + 'px;top:' + project.y + 'px"><span class="knowledge-node-avatar">' + projectLines.map((line) => '<span>' + workspaceEscape(line) + '</span>').join('') + '</span></div>' + nodes;
    }

    function workspaceSetPeopleGraphView(view) {
      if (!["hierarchy", "expanded"].includes(view)) return;
      workspacePeopleGraphView = view;
      try { localStorage.setItem("workspace-people-graph-view", view); } catch {}
      document.querySelectorAll(".graph-view-option").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.graphView === view));
      });
      workspacePeopleGraphWidth = 0;
      workspaceDrawKnowledgeGraph(true);
    }

    function workspaceRenderKnowledgeGraph() {
      workspaceDrawKnowledgeGraph(true);
      if (workspacePeopleResizeObserver) workspacePeopleResizeObserver.disconnect();
      const host = document.getElementById("workspacePeopleGraph");
      if (host && typeof ResizeObserver === "function") {
        workspacePeopleResizeObserver = new ResizeObserver(() => workspaceDrawKnowledgeGraph(false));
        workspacePeopleResizeObserver.observe(host);
      }
    }

    async function workspaceCopyId(id, event) {
      event?.preventDefault();
      event?.stopPropagation();
      if (!id) return false;
      const target = event?.currentTarget || event?.target;
      let copied = false;
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(id);
          copied = true;
        }
      } catch (_) {
        copied = false;
      }
      if (!copied) {
        const input = document.createElement("textarea");
        input.value = id;
        input.setAttribute("readonly", "");
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.appendChild(input);
        input.select();
        try { copied = document.execCommand("copy"); } catch (_) { copied = false; }
        input.remove();
      }
      if (target) {
        const original = target.textContent;
        target.textContent = copied ? "已复制" : "复制失败";
        window.setTimeout(() => { target.textContent = original; }, 1200);
      }
      return copied;
    }

    function workspaceOpenTaskFromPlan(taskId, event) {
      if (event?.target?.closest?.(".plan-topic-link")) return;
      const task = workspaceTasks(workspaceIndex).find((item) => item.task_id === taskId);
      if (!task) return;
      const card = workspaceCards(workspaceIndex).find((item) => item.card_id === task.task_card_id || item.task_id === task.task_id);
      if (card) {
        workspaceOpenCard(card.card_id, event?.currentTarget);
        return;
      }

      const topic = workspaceTopicForTask(workspaceIndex, task);
      const fallbackCard = {
        card_id: task.task_card_id || task.task_id,
        card_type: "task",
        task_id: task.task_id,
        title: task.title || task.task_id,
        author: "Hermes",
        participants: task.owner ? [task.owner] : [],
        topic_id: workspaceTopicId(topic),
        card_text: task.content || task.done_criteria || "暂无任务说明。",
        key_points: [],
      };
      workspaceOpenCard(fallbackCard.card_id, event?.currentTarget, fallbackCard);
    }

    function workspaceHandlePlanKey(event, card) {
      if (event.target !== card) return;
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      workspaceOpenTaskFromPlan(card.dataset.taskId, event);
    }

    function workspaceOpenCard(cardId, trigger, providedCard = null) {
      const card = providedCard || workspaceCards(workspaceIndex).find((item) => item.card_id === cardId);
      if (!card) return;
      const event = workspaceEventMap(workspaceIndex).get(card.human_event_id);
      const date = workspaceDateLabel(workspaceCardDate(card, workspaceEventMap(workspaceIndex)));
      const points = workspaceSummaryPoints(card);
      const body = card.card_text || card.content_text || card.excerpt || "暂无详细内容。";
      const sources = workspaceSourceLinks([card.card_path, card.content_path, ...(card.source_refs || [])].filter(Boolean));
      const cardIdLabel = card.card_type === "task" || Boolean(card.task_id) ? "Task卡片ID" : "Personal卡片ID";
      const relation = workspaceCardRelation(card);
      const revisions = workspaceCardRevisions(workspaceIndex, card);
      const revisionMarkup = revisions.length ? `<section class="workspace-detail-section"><h3>修订历史</h3><ul>${revisions.map((item) => `<li>${workspaceEscape(item.card_id)} · ${workspaceEscape(item.lifecycle_status || "superseded")} · ${workspaceEscape(workspaceDateLabel(item.submitted_at))}</li>`).join("")}</ul></section>` : "";
      document.getElementById("cardDialogContent").innerHTML = `<header class="workspace-dialog-head"><div><h2 id="cardDialogTitle">${workspaceEscape(card.title || card.card_id || "未命名卡片")}</h2><p>${workspaceEscape(date)} · 提交者 ${workspaceEscape(card.author || "未标注")} · 参与人 ${workspaceEscape((card.participants || []).join(" / ") || "未标注")}</p></div><button class="dialog-close" type="button" onclick="workspaceCloseDialog('cardDialog')" aria-label="关闭">×</button></header><div class="workspace-detail"><section class="workspace-detail-section"><h3>${cardIdLabel}</h3><button class="copy-id" type="button" onclick="workspaceCopyId('${workspaceEscape(card.card_id)}',event)" aria-label="复制${cardIdLabel}">${workspaceEscape(card.card_id || "未标注")}</button></section><section class="workspace-detail-section"><h3>总结</h3><ul>${points.map((point) => `<li>${workspaceEscape(point)}</li>`).join("")}</ul></section><section class="workspace-detail-section"><h3>详情</h3><p>${workspaceEscape(body)}</p></section><section class="workspace-detail-section"><h3>${workspaceEscape(relation.label)}</h3><p>${workspaceEscape(relation.title)}</p></section>${revisionMarkup}${sources ? `<section class="workspace-detail-section"><h3>来源</h3><div>${sources}</div></section>` : ""}</div>`;
      workspaceLastDialogTrigger = trigger || document.activeElement;
      document.getElementById("cardDialog").showModal();
      document.body.classList.add("workspace-dialog-open");
    }

    async function workspaceOpenBriefing(briefingId, event) {
      event?.preventDefault();
      event?.stopPropagation();
      const briefing = workspaceBriefings(workspaceIndex).find((item) => item.briefing_id === briefingId);
      if (!briefing) return;
      const dialog = document.getElementById("briefingDialog");
      const content = document.getElementById("briefingDialogContent");
      content.innerHTML = `<header class="workspace-dialog-head"><div><h2 id="briefingDialogTitle">${workspaceEscape(briefing.title || "会前简报")}</h2><p>${workspaceEscape(workspaceBriefingStatus(briefing))} · ${workspaceEscape(briefing.briefing_id)}</p></div><button class="dialog-close" type="button" onclick="workspaceCloseDialog('briefingDialog')" aria-label="关闭">×</button></header><div class="workspace-detail"><section class="workspace-detail-section"><h3>会议使用摘要</h3><ul>${workspaceSummaryPointsFrom(briefing.summary_points, briefing.meeting_goal || briefing.title || "", 3).map((point) => `<li>${workspaceEscape(point)}</li>`).join("")}</ul></section><section class="workspace-detail-section"><h3>完整会前简报</h3><p class="briefing-dialog-body">正在加载……</p></section></div>`;
      workspaceLastDialogTrigger = event?.currentTarget || document.activeElement;
      dialog.showModal();
      document.body.classList.add("workspace-dialog-open");
      const body = dialog.querySelector(".briefing-dialog-body");
      if (body) body.textContent = briefing.public_markdown || "暂无公开的会前简报正文。";
    }

    function workspaceOpenPerson(name, trigger) {
      const person = workspacePeople.get(name);
      if (!person) return;
      const index = workspaceIndex;
      const eventMap = workspaceEventMap(index);
      const topicMap = workspaceTopicMap(index);
      const eventList = [...person.events].map((id) => `<li>${workspaceEscape(eventMap.get(id)?.title || id)}</li>`).join("") || "<li>暂无</li>";
      const topicList = [...person.topics].map((id) => `<li>${workspaceEscape(topicMap.get(id)?.title || id)}</li>`).join("") || "<li>暂无</li>";
      const taskList = [...person.tasks].map((id) => `<li>${workspaceEscape(workspaceTasks(index).find((task) => task.task_id === id)?.title || id)}</li>`).join("") || "<li>暂无</li>";
      document.getElementById("personDialogContent").innerHTML = `<header class="workspace-dialog-head"><div><h2 id="personDialogTitle">${workspaceEscape(person.name)}</h2><p>${workspaceEscape(person.kind)} · ${workspaceEscape(person.portrait)}</p></div><button class="dialog-close" type="button" onclick="workspaceCloseDialog('personDialog')" aria-label="关闭">×</button></header><div class="workspace-detail"><section class="workspace-detail-section"><h3>交流记录 · ${person.events.size}</h3><ul>${eventList}</ul></section><section class="workspace-detail-section"><h3>项目议题 · ${person.topics.size}</h3><ul>${topicList}</ul></section><section class="workspace-detail-section"><h3>Task · ${person.tasks.size}</h3><ul>${taskList}</ul></section></div>`;
      workspaceLastDialogTrigger = trigger || document.activeElement;
      document.getElementById("personDialog").showModal();
      document.body.classList.add("workspace-dialog-open");
    }

    function workspaceCloseDialog(id) {
      document.getElementById(id)?.close();
    }

    function workspaceSetView(view, updateHash = true) {
      const raw = String(view || "");
      let topicId = "";
      if (raw.startsWith("topic-")) {
        try { topicId = decodeURIComponent(raw.slice(6)); }
        catch { topicId = raw.slice(6); }
      }
      const aliases = { timeline: "dynamic", events: "topics", "human-event": "human-events" };
      const target = topicId ? "topics" : (aliases[raw] || ["dynamic", "plan", "human-events", "topics", "files", "people", "process"].includes(raw) ? raw : "dynamic");
      document.querySelectorAll(".tab-panel").forEach((panel) => panel.classList.toggle("active", panel.id === `panel-${target}`));
      document.querySelectorAll(".tab").forEach((button) => button.setAttribute("aria-selected", String(button.dataset.tab === target)));
      if (target === "people") requestAnimationFrame(() => workspaceDrawKnowledgeGraph(true));
      if (updateHash) history.replaceState(null, "", `#${topicId ? `topic-${encodeURIComponent(topicId)}` : target}`);
      if (topicId) requestAnimationFrame(() => {
        const topic = document.getElementById(`topic-${topicId}`);
        const container = document.getElementById("panel-topics");
        if (topic) {
          topic.open = true;
          workspaceScrollContainerTo(container, topic);
        }
      });
    }

    function bindWorkspaceNavigation() {
      document.querySelectorAll(".tab").forEach((button) => button.addEventListener("click", () => workspaceSetView(button.dataset.tab)));
    }

    async function loadWorkspaceReadme() {
      const readme = project.files.find((file) => file.path === "README.md");
      if (readme?.content) workspaceFileContents.set(readme.path, readme.content);
      else workspaceFileContents.delete("README.md");
    }

    async function loadWorkspaceFiles() {
      if (workspaceFilesLoading) return;
      workspaceFilesLoading = true;
      try {
        const manifest = await loadWorkspaceDataset("files");
        if (!Array.isArray(manifest.files)) throw new Error("文件数据缺少 files");
        project.files = manifest.files.map((file) => file.path === "README.md" ? { ...file, content: manifest.readme_text || "" } : file);
        workspaceFileDirectories = new Map((manifest.directories || []).map((directory) => [directory.path, directory]));
        await loadWorkspaceReadme();
        workspaceFilesLoaded = true;
        workspaceFilesError = "";
      } catch (error) {
        workspaceFilesError = error.message;
      } finally {
        workspaceFilesLoading = false;
        renderFiles();
      }
    }

    async function loadWorkspaceCards() {
      const timeline = document.getElementById("dynamicFeed");
      try {
        const [cards, people] = await Promise.all([
          loadWorkspaceDataset("cards"),
          loadWorkspaceDataset("people")
        ]);
        workspaceIndex = { ...cards, people };
        workspaceRefreshPlans(workspaceIndex);
        renderPlanSummary();
        renderPlans();
        workspaceRenderTimeline(workspaceIndex);
        workspaceRenderHumanEvents(workspaceIndex);
        workspaceRenderTopics(workspaceIndex);
        workspaceRenderPeople(workspaceIndex);
        workspaceRenderProcessDesign();
        workspaceSetView(window.location.hash.slice(1), false);
      } catch (error) {
        timeline.className = "workspace-timeline loading";
        timeline.textContent = "状态卡加载失败：" + error.message;
      }
    }

    async function refreshWorkspaceData() {
      if (workspaceRefreshInFlight) return;
      workspaceRefreshInFlight = true;
      try {
        const filesPromise = loadWorkspaceFiles();
        await loadWorkspaceTasks();
        await loadWorkspaceCards();
        await filesPromise;
      } finally {
        workspaceRefreshInFlight = false;
      }
    }

    function bindWorkspaceDialogs() {
      ["cardDialog", "personDialog", "briefingDialog"].forEach((id) => {
        const dialog = document.getElementById(id);
        dialog.addEventListener("click", (event) => {
          const rect = dialog.getBoundingClientRect();
          if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) workspaceCloseDialog(id);
        });
        dialog.addEventListener("close", () => {
          document.body.classList.remove("workspace-dialog-open");
          const trigger = workspaceLastDialogTrigger;
          workspaceLastDialogTrigger = null;
          if (trigger?.isConnected) trigger.focus({ preventScroll: true });
        });
      });
    }

    function saveWorkspaceReloadState() {
      try {
        const panelScroll = Object.fromEntries([...document.querySelectorAll(".tab-panel")].map((panel) => [panel.id, panel.scrollTop]));
        sessionStorage.setItem("workspace-reload-state", JSON.stringify({
          hash: window.location.hash,
          timeline_scroll_top: document.getElementById("timelineViewport")?.scrollTop || 0,
          panel_scroll: panelScroll,
          active_year: workspaceActiveYear,
          active_month: workspaceActiveMonth
        }));
      } catch (_) {
        // A storage-disabled browser can still reload the latest data.
      }
    }

    function restoreWorkspaceReloadState() {
      try {
        const raw = sessionStorage.getItem("workspace-reload-state");
        if (!raw) return;
        sessionStorage.removeItem("workspace-reload-state");
        const state = JSON.parse(raw);
        if (state.hash && window.location.hash !== state.hash) history.replaceState(null, "", state.hash);
        workspaceSetView(window.location.hash.slice(1), false);
        requestAnimationFrame(() => {
          const timelineViewport = document.getElementById("timelineViewport");
          if (timelineViewport) timelineViewport.scrollTop = Number(state.timeline_scroll_top || 0);
          for (const [id, scrollTop] of Object.entries(state.panel_scroll || {})) {
            const panel = document.getElementById(id);
            if (panel) panel.scrollTop = Number(scrollTop || 0);
          }
          if (state.active_year && state.active_month) workspaceSetActiveNav(state.active_year, state.active_month);
        });
      } catch (_) {
        // Ignore malformed restoration state and keep the current view usable.
      }
    }

    async function checkWorkspaceVersion() {
      if (!workspaceDataVersion || workspaceRefreshInFlight) return;
      try {
        const response = await fetch(`public-data/manifest.json?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) return;
        const manifest = await response.json();
        if (!manifest.data_version || manifest.data_version === workspaceDataVersion) return;
        saveWorkspaceReloadState();
        window.location.reload();
      } catch (error) {
        console.warn("Workspace version check failed", error);
      }
    }

    async function bootWorkspace() {
      await loadWorkspaceManifest();
      await loadWorkspaceProject();
      await loadWorkspaceTasks();
      renderHeader();
      renderConfig();
      renderTabs();
      renderDynamic();
      renderPlanSummary();
      renderPlans();
      renderFiles();
      bindInteractions();
      bindWorkspaceNavigation();
      bindWorkspaceDialogs();
      workspaceSetView(window.location.hash.slice(1), false);
      window.addEventListener("hashchange", () => workspaceSetView(window.location.hash.slice(1), false));
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) checkWorkspaceVersion();
      });
      workspaceVersionCheckTimer = window.setInterval(() => {
        if (!document.hidden) checkWorkspaceVersion();
      }, Math.max(10000, Number(project.refresh_interval_ms) || 30000));
      await Promise.all([loadWorkspaceCards(), loadWorkspaceFiles(), loadWorkspaceProcessDesign()]);
      restoreWorkspaceReloadState();
    }

    bootWorkspace();
  </script>
</body>
</html>
