<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workspace</title>
  <meta name="description" content="Project Workspace" />
  <style>
    :root {
      --bg: #fbf4e4;
      --surface: #fff9ee;
      --surface-soft: #f3ead8;
      --surface-tint: #fff2d8;
      --ink: #17130d;
      --muted: #6f675b;
      --line: rgba(23, 19, 13, 0.14);
      --line-strong: rgba(23, 19, 13, 0.24);
      --accent: #17130d;
      --green: #2f8b57;
      --orange: #d56f2b;
      --blue: #2368a2;
      --violet: #7560b5;
      --red: #b94b38;
      --radius: 8px;
      --shadow: 0 18px 48px rgba(33, 24, 10, 0.1);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, #f4d7aa 0%, #fbf4e4 38%, #e9f0d4 100%),
        var(--bg);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .project-head {
      background: rgba(255, 249, 238, 0.88);
      border-bottom: 1px solid var(--line);
      padding: 22px 28px 0;
    }

    .head-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: start;
      max-width: 1280px;
      margin: 0 auto;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.2;
      font-weight: 750;
      font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", Georgia, serif;
      letter-spacing: -0.02em;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      padding: 0 9px;
      border: 1px solid rgba(47, 139, 87, 0.24);
      border-radius: 999px;
      color: #1f6f42;
      background: rgba(47, 139, 87, 0.12);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    .goal-card {
      margin-top: 18px;
      max-width: 760px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(213, 111, 43, 0.18);
      background: var(--surface-tint);
    }

    .goal-label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 14px;
      color: #9f4d16;
      font-size: 14px;
      font-weight: 720;
    }

    .goal-body {
      padding: 0 14px 14px;
      font-size: 15px;
      line-height: 1.55;
      color: #33281c;
    }

    .people-strip {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 18px;
      padding-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .person-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-weight: 570;
      white-space: nowrap;
    }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: #fff;
      font-size: 12px;
      font-weight: 760;
      background: var(--blue);
      flex: 0 0 auto;
    }

    .avatar.vivi { background: #f0b429; }
    .avatar.hermes { background: #188a9a; }
    .avatar.codex { background: #5b6ee1; }

    .participant-menu {
      position: relative;
    }

    .ghost-button {
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
    }

    .participants-panel {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      width: min(520px, calc(100vw - 40px));
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      z-index: 20;
      display: none;
    }

    .participants-panel.open { display: grid; gap: 8px; }

    .participant-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      padding: 10px;
      border-radius: var(--radius);
      background: rgba(251, 244, 228, 0.72);
      border: 1px solid var(--line);
    }

    .participant-card strong {
      display: block;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .participant-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }

    .plan-summary {
      width: 380px;
      min-height: 210px;
      margin-right: 8px;
      display: grid;
      place-items: center;
    }

    .pie-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .pie-slice {
      stroke: rgba(255, 249, 238, 0.92);
      stroke-width: 2;
    }

    .pie-callout {
      stroke: rgba(23, 19, 13, 0.72);
      stroke-width: 1.4;
      fill: none;
    }

    .pie-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 760;
    }

    .pie-count {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .pie-center {
      fill: var(--surface);
      stroke: rgba(23, 19, 13, 0.12);
      stroke-width: 1;
    }

    .pie-total {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 850;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
      align-self: flex-start;
      margin-top: 24px;
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .action-button {
      width: auto;
      min-width: 0;
      padding: 0 14px;
      border-radius: 999px;
      grid-auto-flow: column;
      gap: 8px;
      font-size: 13px;
      font-weight: 720;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 292px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      min-height: 0;
    }

    .sidebar {
      order: 2;
      border-left: 0;
      padding: 24px 18px;
      background: transparent;
    }

    .config-stack {
      display: grid;
      gap: 12px;
    }

    .config-shell {
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      padding: 0;
    }

    .config-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(36, 39, 43, 0.02);
    }

    .config-toggle {
      width: 100%;
      min-height: 70px;
      border: 0;
      background: transparent;
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      text-align: left;
      cursor: pointer;
    }

    .config-toggle strong {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .config-toggle span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .config-card.open .config-summary {
      display: none;
    }

    .plus {
      color: rgba(23, 19, 13, 0.54);
      font-size: 22px;
      line-height: 1;
      transform-origin: center;
      transition: transform .15s ease;
    }

    .config-card.open .plus { transform: rotate(45deg); }

    .config-body {
      display: none;
      padding: 0 14px 14px;
      color: #4f4539;
      font-size: 12px;
      line-height: 1.6;
    }

    .config-card.open .config-body { display: block; }

    .config-card.open .config-toggle {
      min-height: 0;
      padding-bottom: 2px;
    }

    .config-card.open .config-toggle strong {
      margin-bottom: 0;
    }

    .config-card.open .config-body {
      padding-top: 0;
    }

    .config-body ul {
      margin: 0;
      padding-left: 17px;
    }

    .main {
      order: 1;
      min-width: 0;
      padding: 22px 28px 42px 0;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin: -2px 0 20px 0;
      padding: 0 12px;
      background: var(--surface);
      overflow-x: auto;
      box-shadow: 0 8px 20px rgba(33, 24, 10, 0.05);
    }

    .tab {
      position: relative;
      flex: 0 0 auto;
      min-height: 50px;
      border: 0;
      background: transparent;
      padding: 0 10px;
      color: #5f564b;
      cursor: pointer;
      font-size: 15px;
      font-weight: 680;
    }

    .tab[aria-selected="true"] {
      color: var(--accent);
    }

    .tab[aria-selected="true"]::after {
      content: "";
      position: absolute;
      left: 9px;
      right: 9px;
      bottom: 0;
      height: 2px;
      border-radius: 999px;
      background: var(--accent);
    }

    .toolbar {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding-left: 0;
    }

    .primary-button,
    .secondary-button,
    .select-button {
      min-height: 36px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 0 14px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
    }

    .primary-button {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 10px 22px rgba(33, 24, 10, 0.14);
    }

    .search {
      width: 38px;
      padding: 0;
      justify-content: center;
      color: var(--muted);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .plan-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(210px, 1fr));
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .plan-column {
      min-height: 470px;
      border-radius: 12px;
      background: var(--surface-soft);
      padding: 14px;
    }

    .column-head {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      margin-bottom: 12px;
      color: #4f4539;
      font-size: 13px;
      font-weight: 720;
    }

    .ring {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px dashed rgba(23, 19, 13, 0.34);
      flex: 0 0 auto;
    }

    .ring.active { border-style: solid; border-color: var(--green); }
    .ring.paused { border-style: solid; border-color: var(--orange); }
    .ring.done { border-style: solid; border-color: var(--blue); background: rgba(34, 120, 212, 0.12); }

    .count {
      color: var(--muted);
      font-weight: 650;
    }

    .add-small {
      margin-left: auto;
      color: #9a9a9a;
      font-size: 18px;
      line-height: 1;
    }

    .plan-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 8px 20px rgba(33, 24, 10, 0.06);
      cursor: pointer;
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }

    .plan-card:hover { border-color: var(--line-strong); box-shadow: 0 12px 24px rgba(33, 24, 10, .09); transform: translateY(-1px); }
    .plan-card:focus-visible { outline: 3px solid rgba(35, 104, 162, .2); outline-offset: 2px; border-color: rgba(35, 104, 162, .46); }
    .plan-topic-link { color: #1c5b91; }

    .plan-card h3,
    .record-card h3,
    .file-card h3 {
      margin: 0 0 8px;
      font-size: 14px;
      line-height: 1.35;
    }

    .plan-card p,
    .record-card p,
    .file-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: rgba(23, 19, 13, 0.07);
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .tag.green { color: #1f6f42; background: rgba(47, 139, 87, 0.12); }
    .tag.orange { color: #9f4d16; background: rgba(213, 111, 43, 0.14); }
    .tag.blue { color: #1c5b91; background: rgba(35, 104, 162, 0.12); }
    .tag.violet { color: #5d48a0; background: rgba(117, 96, 181, 0.12); }

    .empty-state {
      min-height: 190px;
      display: grid;
      place-items: center;
      text-align: center;
      color: #9a9a9d;
      font-size: 13px;
      line-height: 1.7;
    }

    .feed,
    .file-grid {
      display: grid;
      gap: 12px;
    }

    .record-card,
    .file-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      padding: 14px;
      box-shadow: 0 8px 20px rgba(33, 24, 10, 0.05);
    }

    .record-card {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr);
      gap: 14px;
    }

    .date-box {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .file-grid {
      display: block;
    }

    .file-path {
      display: block;
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      background: rgba(23, 19, 13, 0.06);
      color: #4f4539;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .file-tree {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 249, 238, 0.78);
      box-shadow: 0 8px 20px rgba(33, 24, 10, 0.05);
      padding: 14px 16px 16px;
    }

    .tree-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tree-list .tree-list {
      margin-left: 12px;
      padding-left: 18px;
      border-left: 1px solid rgba(23, 19, 13, 0.16);
    }

    .tree-node {
      position: relative;
      margin: 8px 0;
    }

    .tree-list .tree-list .tree-node::before {
      content: "";
      position: absolute;
      top: 15px;
      left: -18px;
      width: 13px;
      border-top: 1px solid rgba(23, 19, 13, 0.16);
    }

    .tree-toggle {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 0;
      text-align: left;
      cursor: pointer;
    }

    .folder-label,
    .file-label {
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 720;
    }

    .tree-caret {
      width: 16px;
      color: rgba(23, 19, 13, 0.52);
      font-size: 12px;
      line-height: 1;
      transition: transform .15s ease;
      flex: 0 0 auto;
    }

    .tree-toggle[aria-expanded="true"] .tree-caret {
      transform: rotate(90deg);
    }

    .tree-name {
      flex: 0 0 auto;
    }

    .tree-desc {
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 520;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-icon,
    .file-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 12px;
      line-height: 1;
    }

    .folder-icon {
      background: rgba(213, 111, 43, 0.14);
      color: #9f4d16;
    }

    .file-icon {
      background: rgba(35, 104, 162, 0.12);
      color: #1c5b91;
    }

    .tree-file {
      margin: 4px 0 8px 30px;
      padding: 10px 12px;
      border: 1px solid rgba(23, 19, 13, 0.1);
      border-radius: var(--radius);
      background: rgba(255, 249, 238, 0.72);
    }

    .tree-file p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .tree-file-readme {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: #30271c;
      font-size: 13px;
      line-height: 1.65;
    }

    .tree-file-readme h4,
    .tree-file-readme h5,
    .tree-file-readme h6 {
      margin: 18px 0 7px;
      color: var(--ink);
      line-height: 1.35;
    }

    .tree-file-readme h4 { font-size: 17px; }
    .tree-file-readme h5 { font-size: 15px; }
    .tree-file-readme h6 { font-size: 13px; }
    .tree-file-readme p { margin: 9px 0; }
    .tree-file-readme ul,
    .tree-file-readme ol { margin: 8px 0; padding-left: 22px; }
    .tree-file-readme li { margin: 4px 0; }
    .tree-file-readme blockquote { margin: 10px 0; padding: 7px 12px; border-left: 3px solid rgba(213,111,43,.38); color: var(--muted); background: rgba(243,234,216,.55); }
    .tree-file-readme pre { margin: 10px 0; padding: 10px 12px; overflow: auto; border-radius: 6px; background: #f3ead8; color: #3f3426; font-family: var(--mono); font-size: 11px; line-height: 1.55; white-space: pre; }
    .tree-file-readme code { padding: 1px 4px; border-radius: 4px; background: rgba(243,234,216,.8); font-family: var(--mono); font-size: .92em; }
    .tree-file-readme pre code { padding: 0; background: transparent; }
    .tree-file-readme a { color: #1c5b91; text-decoration: underline; text-underline-offset: 2px; }
    .tree-file-readme table { width: 100%; margin: 10px 0; border-collapse: collapse; font-size: 12px; }
    .tree-file-readme th,
    .tree-file-readme td { padding: 6px 8px; border: 1px solid var(--line); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
    .tree-file-readme th { background: rgba(243,234,216,.65); color: var(--ink); font-weight: 720; }

    .tree-file .card-meta {
      margin-top: 8px;
    }

    .tree-children[hidden],
    .tree-file[hidden] {
      display: none;
    }

    .note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .state-panel-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin: 2px 0 18px;
    }

    .state-panel-head.compact { align-items: flex-start; }

    .state-panel-head h2 {
      margin: 4px 0 5px;
      font-size: 22px;
      line-height: 1.25;
    }

    .state-panel-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .dynamic-summary {
      display: flex;
      align-items: baseline;
      gap: 9px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .dynamic-summary strong { color: var(--ink); font-size: 18px; }
    .dynamic-summary-divider { color: var(--line-strong); }

    .state-eyebrow {
      color: #9f4d16;
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .state-counts {
      display: flex;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .state-counts strong { color: var(--ink); font-size: 18px; }

    .timeline-workspace {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .archive-nav {
      position: sticky;
      top: 18px;
      min-width: 0;
    }

    .nav-head {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .process-chevron { width: 8px; height: 8px; border-right: 1px solid var(--muted); border-bottom: 1px solid var(--muted); transform: rotate(45deg) translateY(-2px); }
    .process-section[open] .process-chevron { transform: rotate(225deg) translateY(-1px); }
    .process-section-body { border-top: 1px solid var(--line); padding: 14px 16px 17px; color: #493f32; font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
    .process-section-body > :first-child { margin-top: 0; }
    .process-section-body > :last-child { margin-bottom: 0; }
    .process-section-body p { margin: 0 0 10px; }
    .process-section-body ul, .process-section-body ol { margin: 8px 0 12px; padding-left: 20px; }
    .process-section-body table { width: 100%; margin: 10px 0; border-collapse: collapse; font-size: 12px; }
    .process-section-body th, .process-section-body td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
    .process-section-body th { color: var(--muted); font-weight: 720; }
    .process-section-body pre { overflow-x: auto; border-radius: 6px; padding: 11px 12px; background: #201b15; color: #fff9ee; font-size: 11px; line-height: 1.55; }
    .process-section-body code { font-family: var(--mono); font-size: .92em; }
    .process-section-body blockquote { margin: 10px 0; border-left: 3px solid var(--orange); padding: 3px 0 3px 12px; color: var(--muted); }
    .process-source-line { display: flex; flex-wrap: wrap; gap: 8px 16px; padding-top: 2px; color: var(--muted); font-size: 11px; }
    .process-source-line a { color: #1c5b91; text-decoration: underline; text-decoration-color: rgba(35,104,162,.25); text-underline-offset: 3px; }
    .process-error { min-height: 180px; display: grid; place-items: center; color: var(--muted); font-size: 13px; }

    @media (max-width: 880px) {
      .timeline-workspace { grid-template-columns: 1fr; gap: 18px; }
      .timeline-workspace .archive-nav { position: static; }
      .timeline-workspace .nav-body { overflow-x: auto; max-height: none; }
      .nav-columns { min-width: 520px; }
      .workspace-timeline { padding-left: 20px; }
      .workspace-timeline .month-title::before { left: -23px; }
      .thumbnail-layout { grid-template-columns: 1fr; }

      .thumbnail-submitter { display: inline-flex; align-items: baseline; gap: 6px; }
      .thumbnail-head { gap: 10px; }

      .people-graph { min-height: 500px; }

      .process-layout { grid-template-columns: 1fr; }

    @media (max-width: 980px) {
      .head-grid {

        justify-content: flex-start;

</head>
<body>

  <script>
    const project = {
      title: "",
      status: "",
      goal: "",
      creator: {},
      owner: {},
      participants: [],
      tabs: [],
      config: [],
      dynamic: [],
      plans: [],
      files: []
    };

    const planStates = [
      { name: "待开始", ring: "", color: "#b8aa96" },
      { name: "进行中", ring: "active", color: "#2f8b57" },
      { name: "暂停", ring: "paused", color: "#d56f2b" },
      { name: "完成", ring: "done", color: "#2368a2" }
    ];

    function avatar(person) {
      return `<span class="avatar ${person.tone || ""}">${person.avatar}</span>`;
    }

    function chip(person) {
      return `${avatar(person)}<span>${person.name}</span>`;
    }

    let workspaceManifest = null;
    let workspaceDataVersion = "";
    let workspaceVersionCheckTimer = null;

    async function loadWorkspaceManifest({ cacheBust = true } = {}) {
      const suffix = cacheBust ? `?t=${Date.now()}` : "";
      const response = await fetch(`public-data/manifest.json${suffix}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`manifest.json HTTP ${response.status}`);
      const data = await response.json();
      if (!data?.data_version || !data?.datasets) throw new Error("manifest.json 缺少 data_version 或 datasets");
      workspaceManifest = data;
      workspaceDataVersion = data.data_version;
      return data;
    }

    function workspaceDatasetUrl(name) {
      const value = workspaceManifest?.datasets?.[name];
      if (!value) throw new Error(`公开数据集不存在：${name}`);
      return value;
    }

    async function loadWorkspaceDataset(name) {
      const response = await fetch(`${workspaceDatasetUrl(name)}?v=${encodeURIComponent(workspaceDataVersion)}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`${name}.json HTTP ${response.status}`);
      return response.json();
    }

    async function loadWorkspaceProject() {
      const data = await loadWorkspaceDataset("project");
      Object.assign(project, data, { files: [], plans: [], dynamic: [] });
      window.workspaceProjectTitle = project.title;
      if (!Array.isArray(project.tabs)) project.tabs = [];
      if (!Array.isArray(project.config)) project.config = [];
      if (!Array.isArray(project.participants)) project.participants = [];
      const relayLink = document.querySelector('a[data-external="agentrelay-dashboard"]');
      if (relayLink) {
        const url = String(project?.links?.agentrelay_dashboard || "").trim();
        if (/^https?:\/\//.test(url)) relayLink.href = url;
        else relayLink.style.setProperty("display", "none");
      }
    }

    async function loadWorkspaceTasks() {
      try {
        const data = await loadWorkspaceDataset("tasks");
        const tasks = Array.isArray(data.tasks) ? data.tasks : [];
        workspaceTaskRegistry = new Map(tasks.filter((task) => task?.task_id).map((task) => [task.task_id, task]));
        project.plans = [];
      } catch (error) {
        console.warn("public tasks unavailable", error);
      }
    }
    function renderHeader() {
      document.title = `${project.title || "Workspace"} | Workspace`;
      document.getElementById("projectTitle").textContent = project.title;
      document.getElementById("projectStatus").textContent = project.status;
      document.getElementById("projectGoal").textContent = project.goal;
      document.getElementById("creatorChip").innerHTML = chip(project.creator);
      document.getElementById("ownerChip").innerHTML = chip(project.owner);

      const extraCount = Math.max(project.participants.length - 2, 0);
      document.getElementById("peopleButton").textContent = `全部参与人 +${extraCount}`;
      document.getElementById("peoplePanel").innerHTML = project.participants.map((person) => `
        <article class="participant-card">
          ${avatar(person)}
          <div>
            <strong>${person.name}</strong>
            <p>${person.portrait}</p>
          </div>
        </article>
      `).join("");
    }

    function renderConfig() {
      document.getElementById("configStack").innerHTML = project.config.map((item) => `
        <article class="config-card">
          <button class="config-toggle" type="button" aria-expanded="false">
            <span><strong>${item.title}</strong><span class="config-summary">${item.summary}</span></span>
            <span class="plus">+</span>
          </button>
          <div class="config-body">
            <ul>${item.body.map((line) => `<li>${line}</li>`).join("")}</ul>
          </div>
        </article>
      `).join("");
    }

    function renderTabs() {
      document.getElementById("tabs").innerHTML = project.tabs.map((tab, index) => `
        <button class="tab" id="tab-${tab.id}" type="button" role="tab" aria-controls="panel-${tab.id}" aria-selected="${index === 0 ? "true" : "false"}" data-tab="${tab.id}">
          ${tab.label}
        </button>
      `).join("");
    }

    function renderDynamic() {
      document.getElementById("dynamicFeed").innerHTML = project.dynamic.map((item) => `
        <article class="record-card">
          <div class="date-box">${item.date}</div>
          <div>
            <h3>${item.title}</h3>
            <p>${item.summary}</p>
            <div class="card-meta">${item.tags.map((tag) => `<span class="tag violet">${tag}</span>`).join("")}</div>
          </div>
        </article>
      `).join("");
    }

    function renderPlanSummary() {
      const counts = planStates.map((state) => ({
        ...state,
        count: project.plans.filter((plan) => plan.status === state.name).length
      }));
      const total = counts.reduce((sum, item) => sum + item.count, 0);
      const svg = document.getElementById("planPie");
      const cx = 190;
      const cy = 112;
      const radius = 74;
      let angle = -90;

      function polarToCartesian(centerX, centerY, r, deg) {
        const rad = (deg - 90) * Math.PI / 180;
        return {
          x: centerX + (r * Math.cos(rad)),
          y: centerY + (r * Math.sin(rad))
        };
      }

      function describeArc(startAngle, endAngle) {
        const start = polarToCartesian(cx, cy, radius, endAngle);
        const end = polarToCartesian(cx, cy, radius, startAngle);
        const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
        return [
          `M ${cx} ${cy}`,
          `L ${start.x} ${start.y}`,
          `A ${radius} ${radius} 0 ${largeArcFlag} 0 ${end.x} ${end.y}`,
          "Z"
        ].join(" ");
      }

      const slices = [];
      const labels = [];
      counts.forEach((item, index) => {
        if (!item.count || !total) return;
        const sweep = (item.count / total) * 360;
        const startAngle = angle;
        const endAngle = angle + sweep;
        const midAngle = startAngle + sweep / 2;
        const labelSide = Math.cos((midAngle - 90) * Math.PI / 180) >= 0 ? "right" : "left";
        const edge = polarToCartesian(cx, cy, radius + 2, midAngle);
        const elbow = polarToCartesian(cx, cy, radius + 22, midAngle);
        const labelX = labelSide === "right" ? elbow.x + 34 : elbow.x - 34;
        const labelY = elbow.y + (index % 2 === 0 ? -2 : 10) - (item.name === "完成" ? 16 : 0);
        const lineEndX = labelSide === "right" ? labelX - 8 : labelX + 8;
        const textAnchor = labelSide === "right" ? "start" : "end";

        slices.push(`<path class="pie-slice" d="${describeArc(startAngle, endAngle)}" fill="${item.color}"></path>`);
        labels.push(`
          <path class="pie-callout" d="M ${edge.x} ${edge.y} L ${elbow.x} ${elbow.y} L ${lineEndX} ${labelY}"></path>
          <text class="pie-label" x="${labelX}" y="${labelY - 5}" text-anchor="${textAnchor}">${item.name}</text>
          <text class="pie-count" x="${labelX}" y="${labelY + 12}" text-anchor="${textAnchor}">${item.count} 项</text>
        `);
        angle = endAngle;
      });

      svg.innerHTML = `
        <title id="planPieTitle">计划状态</title>
        <desc id="planPieDesc">按待开始、进行中、暂停、完成统计计划数量，共 ${total} 项</desc>
        <g>${slices.join("")}</g>
        <circle class="pie-center" cx="${cx}" cy="${cy}" r="27"></circle>
        <text class="pie-total" x="${cx}" y="${cy}">${total}</text>
        <g>${labels.join("")}</g>
      `;
    }

    function renderPlans() {
      document.getElementById("planBoard").innerHTML = planStates.map((state) => {
        const items = project.plans.filter((plan) => plan.status === state.name);
        const body = items.length ? items.map((plan) => `
          <article class="plan-card" role="button" tabindex="0" data-task-id="${workspaceEscape(plan.task_id)}" aria-label="查看任务卡片：${workspaceEscape(plan.title)}" onclick="workspaceOpenTaskFromPlan(this.dataset.taskId,event)" onkeydown="workspaceHandlePlanKey(event,this)">
            <h3>${workspaceEscape(plan.title)}</h3>
            <div class="card-meta">
              <span class="tag">${workspaceEscape(plan.owner)}</span>
              <a class="tag plan-topic-link" href="#topic-${encodeURIComponent(plan.topic_id || "")}" onclick="event.stopPropagation()">${workspaceEscape(plan.topic_title || plan.tag)}</a>
            </div>
          </article>
        `).join("") : `<div class="empty-state">暂无事项<br>可以这里开始新建</div>`;

        return `
          <section class="plan-column" aria-label="${state.name}">
            <div class="column-head"><span class="ring ${state.ring}"></span><span>${state.name}</span><span class="count">${items.length}</span><span class="add-small">+</span></div>
            ${body}
          </section>
        `;
      }).join("");
    }

    function buildFileTree(files) {
      const root = {};
      files.forEach((file) => {
        const parts = file.path.split("/");
        let node = root;
        parts.forEach((part, index) => {
          if (index === parts.length - 1) {
            node.__files = node.__files || [];
            node.__files.push({ ...file, name: part });
          } else {
            node[part] = node[part] || {};
            node = node[part];
          }
        });
      });
      return root;
    }

    function folderDescription(name, fullPath = name) {
      const manifestDescription = workspaceFileDirectories.get(fullPath)?.description;
      if (manifestDescription) return manifestDescription;
      const descriptions = {
        "02-notes": "可复用整理和项目 wiki。",
        "wiki": "沉淀协议、概念和协作知识。",
        "03-decisions": "项目规则、协议和已确认决策。",
        "04-reports": "阶段性报告、复盘和验收记录。",
        "05-agent-outputs": "各参与 Agent 提交的项目产出。",
        "06-pdca": "失败样例、纠正和复测问题。",
        "07-state": "项目状态、索引和记忆候选。",
        "08-cards": "项目卡片与关联内容。"
      };
      return descriptions[name] || "项目文件夹。";
    }

    function fileTreeDomId(prefix, value) {
      let hash = 2166136261;
      for (const character of String(value || "")) {
        hash ^= character.codePointAt(0);
        hash = Math.imul(hash, 16777619);
      }
      return `${prefix}-${(hash >>> 0).toString(16)}`;
    }

    function workspaceFileUrl(file) {
      if (file.published === false) return "";
      if (file.url) return file.url;
      return "/collaborate/" + String(file.path || "").split("/").map(encodeURIComponent).join("/");
    }

    function workspaceInlineMarkdown(value) {
      let html = workspaceEscape(value);
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\[([^\]]+)\]\(((?:https?:\/\/|\/|\.\/)[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/~~([^~]+)~~/g, "<del>$1</del>");
      return html;
    }

    function workspaceRenderMarkdown(markdown) {
      const lines = String(markdown || "").replace(/\r\n?/g, "\n").split("\n");
      const output = [];
      let paragraph = [];
      let listType = "";
      let codeLines = null;

      const flushParagraph = () => {
        if (!paragraph.length) return;
        output.push(`<p>${paragraph.map(workspaceInlineMarkdown).join("<br>")}</p>`);
        paragraph = [];
      };
      const closeList = () => {
        if (!listType) return;
        output.push(`</${listType}>`);
        listType = "";
      };
      const flushText = () => {
        flushParagraph();
        closeList();
      };
      const renderTable = (tableLines) => {
        const rows = tableLines
          .filter((line) => !/^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line))
          .map((line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim()));
        if (!rows.length) return;
        const header = rows[0].map((cell) => `<th>${workspaceInlineMarkdown(cell)}</th>`).join("");
        const body = rows.slice(1).map((row) => `<tr>${row.map((cell) => `<td>${workspaceInlineMarkdown(cell)}</td>`).join("")}</tr>`).join("");
        output.push(`<table><thead><tr>${header}</tr></thead>${body ? `<tbody>${body}</tbody>` : ""}</table>`);
      };

      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        if (codeLines) {
          if (/^\s*```/.test(line)) {
            output.push(`<pre><code>${workspaceEscape(codeLines.join("\n"))}</code></pre>`);
            codeLines = null;
          } else {
            codeLines.push(line);
          }
          continue;
        }
        if (/^\s*```/.test(line)) {
          flushText();
          codeLines = [];
          continue;
        }
        if (!line.trim()) {
          flushText();
          continue;
        }
        const tableLines = [];
        if (/^\s*\|/.test(line) && index + 1 < lines.length && /^\s*\|/.test(lines[index + 1])) {
          flushText();
          tableLines.push(line);
          while (index + 1 < lines.length && /^\s*\|/.test(lines[index + 1])) tableLines.push(lines[++index]);
          renderTable(tableLines);
          continue;
        }
        const heading = line.match(/^\s*(#{1,6})\s+(.+?)\s*#*\s*$/);
        if (heading) {
          flushText();
          const tag = heading[1].length === 1 ? "h4" : heading[1].length === 2 ? "h5" : "h6";
          output.push(`<${tag}>${workspaceInlineMarkdown(heading[2])}</${tag}>`);
          continue;
        }
        const bullet = line.match(/^\s*[-*+]\s+(.+)$/);
        const numbered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        if (bullet || numbered) {
          flushParagraph();
          const nextListType = bullet ? "ul" : "ol";
          if (listType !== nextListType) {
            closeList();
            listType = nextListType;
            output.push(`<${listType}>`);
          }
          output.push(`<li>${workspaceInlineMarkdown((bullet || numbered)[1])}</li>`);
          continue;
        }
        const quote = line.match(/^\s*>\s?(.*)$/);
        if (quote) {
          flushText();
          output.push(`<blockquote>${workspaceInlineMarkdown(quote[1])}</blockquote>`);
          continue;
        }
        paragraph.push(line.trim());
      }
      if (codeLines) output.push(`<pre><code>${workspaceEscape(codeLines.join("\n"))}</code></pre>`);
      flushText();
      return output.join("");
    }

    function renderFileNode(file) {
      const key = `file:${file.path}`;
      const id = fileTreeDomId("file", file.path);
      const expanded = workspaceOpenFileNodes.has(key);
      const tags = Array.isArray(file.tags) ? file.tags : [];
      const fileUrl = workspaceFileUrl(file);
      const readme = file.path === "README.md" ? workspaceFileContents.get(file.path) : "";
      const readmeMarkup = file.path === "README.md"
        ? `<div class="tree-file-readme">${readme ? workspaceRenderMarkdown(readme) : "<p>正在加载 README 全文...</p>"}</div>`
        : "";
      return `
        <li class="tree-node">
          <button class="tree-toggle" type="button" data-tree-path="${workspaceEscape(key)}" aria-expanded="${expanded}" aria-controls="${id}">
            <span class="file-label">
              <span class="tree-caret">▶</span>
              <span class="file-icon">文</span>
              <span class="tree-name">${workspaceEscape(file.name || file.path)}</span>
              <span class="tree-desc">${workspaceEscape(file.summary || "项目文件。")}</span>
            </span>
          </button>
          <article class="tree-file" id="${id}" ${expanded ? "" : "hidden"}>
            <h3>${workspaceEscape(file.title || file.name || file.path)}</h3>
            <p>${workspaceEscape(file.summary || "项目文件。")}</p>
            <div class="card-meta">${tags.map((tag) => `<span class="tag blue">${workspaceEscape(tag)}</span>`).join("")}</div>
            ${readmeMarkup}
            ${fileUrl ? `<a class="file-path" href="${workspaceEscape(fileUrl)}">${workspaceEscape(file.path)}</a>` : `<span class="file-path">${workspaceEscape(file.path)} · 暂不可公开读取</span>`}
          </article>
        </li>
      `;
    }

    function renderTreeNode(name, node, depth = 0, parentPath = "") {
      const childDirs = Object.keys(node).filter((key) => key !== "__files").sort();
      const files = (node.__files || []).sort((a, b) => a.name.localeCompare(b.name));
      const fullPath = parentPath ? `${parentPath}/${name}` : name;
      const id = fileTreeDomId("tree", fullPath);
      const expanded = workspaceOpenFileNodes.has(fullPath);
      return `
        <li class="tree-node">
          <button class="tree-toggle" type="button" data-tree-path="${workspaceEscape(fullPath)}" aria-expanded="${expanded}" aria-controls="${id}">
            <span class="folder-label">
              <span class="tree-caret">▶</span>
              <span class="folder-icon">▣</span>
              <span class="tree-name">${workspaceEscape(name)}</span>
              <span class="tree-desc">${workspaceEscape(folderDescription(name, fullPath))}</span>
            </span>
          </button>
          <ul class="tree-list tree-children" id="${id}" ${expanded ? "" : "hidden"}>
            ${childDirs.map((dir) => renderTreeNode(dir, node[dir], depth + 1, fullPath)).join("")}
            ${files.map(renderFileNode).join("")}
          </ul>
        </li>
      `;
    }

    function renderFiles() {
      const host = document.getElementById("fileGrid");
      if (!workspaceFilesLoaded && !project.files.length) {

      }
      if (workspaceFilesError && !project.files.length) {
        host.innerHTML = `<div class="file-tree"><div class="empty-state">项目文件加载失败：${workspaceEscape(workspaceFilesError)}</div></div>`;

      const rootFiles = (tree.__files || []).sort((a, b) => a.name.localeCompare(b.name));
      host.innerHTML = `
        <div class="file-tree" aria-label="文件视图">
          <ul class="tree-list">

      const peopleButton = document.getElementById("peopleButton");

      peopleButton.addEventListener("click", () => {
        const open = peoplePanel.classList.toggle("open");
        peopleButton.setAttribute("aria-expanded", String(open));
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".participant-menu")) {
          peoplePanel.classList.remove("open");
          peopleButton.setAttribute("aria-expanded", "false");
        }
      });

      document.querySelectorAll(".config-toggle").forEach((button) => {
        button.addEventListener("click", () => {
          const card = button.closest(".config-card");
          const open = card.classList.toggle("open");
          button.setAttribute("aria-expanded", String(open));
        });
      });

      document.getElementById("fileGrid").addEventListener("click", (event) => {
        const button = event.target.closest(".tree-toggle");
        if (!button) return;
        const target = document.getElementById(button.getAttribute("aria-controls"));
        if (!target) return;
        const open = button.getAttribute("aria-expanded") !== "true";
        button.setAttribute("aria-expanded", String(open));
        target.hidden = !open;

        if (key) {
          if (open) workspaceOpenFileNodes.add(key);
          else workspaceOpenFileNodes.delete(key);
        }

    function workspaceEscape(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")

    function workspaceProcessMetrics() {
      const index = workspaceIndex || {};
      const cards = workspaceCards(index);
      const humanEvents = workspaceEvents(index);
      const topics = workspaceTopics(index);
      const tasks = workspaceTasks(index);

    function workspaceRenderProcessDesign() {
      const host = document.getElementById("processContainer");
      if (!host || !workspaceProcessDesign) return;
      const sections = Array.isArray(workspaceProcessDesign.sections) ? workspaceProcessDesign.sections : [];
      const detailSections = sections.filter((section) => section.id !== "overview");
      const flow = Array.isArray(workspaceProcessDesign.flow) ? workspaceProcessDesign.flow : [];
      const flowMarkup = flow.map((step, index) => `<span class="process-flow-step"><span class="process-flow-index">${String(index + 1).padStart(2, "0")}</span><span>${workspaceEscape(step)}</span></span>`).join("");
      const metrics = workspaceProcessMetrics().map((metric) => `<div class="process-metric"><strong>${metric.value}</strong><span>${workspaceEscape(metric.label)}</span></div>`).join("");
      const nav = detailSections.map((section) => `<button class="process-nav-link" type="button" data-process-target="process-${workspaceEscape(section.id)}">${workspaceEscape(section.title)}</button>`).join("");
      const sectionMarkup = detailSections.map((section, index) => {
        const pending = section.status === "pending";
        const open = index < 2 || section.id === "open-questions";
        return `<details class="process-section" id="process-${workspaceEscape(section.id)}" ${open ? "open" : ""}><summary><span class="process-section-title"><strong>${workspaceEscape(section.title)}</strong><span class="process-status ${pending ? "pending" : ""}">${pending ? "待确认" : "当前规则"}</span></span><span class="process-chevron" aria-hidden="true"></span></summary><div class="process-section-body">${workspaceRenderMarkdown(section.body_markdown || "")}</div></details>`;
      }).join("");
      host.className = "process-layout";
      host.innerHTML = `<nav class="process-nav" aria-label="流程章节"><span class="process-nav-label">流程章节</span>${nav}</nav><div class="process-content"><section class="process-overview" aria-label="项目总流程"><div class="process-flow">${flowMarkup}</div></section><section class="process-metrics" aria-label="当前项目对象统计">${metrics}</section><div class="process-sections">${sectionMarkup}</div><div class="process-source-line"><span>权威来源：${workspaceEscape(workspaceProcessDesign.source_path || "项目流程设计")}</span><span>数据版本：${workspaceEscape(workspaceDataVersion)}</span></div></div>`;
      host.querySelectorAll("[data-process-target]").forEach((button) => button.addEventListener("click", () => {
        const section = document.getElementById(button.dataset.processTarget);
        if (!section) return;
        section.open = true;
        workspaceScrollContainerTo(document.getElementById("panel-process"), section);
      }));

    async function loadWorkspaceProcessDesign() {
      const host = document.getElementById("processContainer");
      try {
        const data = await loadWorkspaceDataset("process");
        if (!Array.isArray(data.sections)) throw new Error("流程数据缺少 sections");
        workspaceProcessDesign = data;
        workspaceRenderProcessDesign();
      } catch (error) {
        if (host) {
          host.className = "process-error";
          host.textContent = "用户手册加载失败：" + error.message;
        }
      }
    }

    function workspaceDate(value) {
      const raw = String(value || "");
      const direct = raw.match(/^(20\d{2})-(\d{2})-(\d{2})/);
      if (direct) return { year: direct[1], month: direct[2], day: direct[3], value: raw };
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return { year: "", month: "", day: "", value: raw };
      return { year: String(date.getFullYear()), month: String(date.getMonth() + 1).padStart(2, "0"), day: String(date.getDate()).padStart(2, "0"), value: raw };
    }

    function workspaceDateLabel(value) {
      const date = workspaceDate(value);
      return date.year ? `${date.year}-${date.month}-${date.day}` : "未知时间";
    }

    function workspaceEvents(index) {
      return (Array.isArray(index.human_events) ? index.human_events : []).filter((event) => event.test !== true);
    }

    function workspaceTopics(index) {
      return (Array.isArray(index.topics) ? index.topics : []).filter((topic) => topic.test !== true);
    }

    function workspaceCards(index) {
      return (Array.isArray(index.cards) ? index.cards : []).filter((card) => card.test !== true);
    }

    function workspaceCardRevisions(index, card) {
      const revisions = Array.isArray(index.card_revisions) ? index.card_revisions : [];
      return revisions.filter((item) => {
        if (item.human_event_id !== card.human_event_id) return false;
        if (String(item.author || "").toLowerCase() !== String(card.author || "").toLowerCase()) return false;
        return item.revision_group_id && item.revision_group_id === card.revision_group_id;
      }).sort((a, b) => Number(a.revision_number || 0) - Number(b.revision_number || 0));
    }

    function workspaceTasks(index) {
      const cardTasks = (Array.isArray(index.tasks) ? index.tasks : []).filter((task) => task.test !== true);
      const merged = new Map(cardTasks.filter((task) => task?.task_id).map((task) => [task.task_id, task]));
      workspaceTaskRegistry.forEach((task, taskId) => {
        merged.set(taskId, { ...(merged.get(taskId) || {}), ...task });
      });
      return [...merged.values()];
    }

    function workspaceTopicTaskIds(index) {
      const topicIds = new Set(workspaceTopics(index).map((topic) => workspaceTopicId(topic)).filter(Boolean));
      const ids = new Set();
      workspaceTopics(index).forEach((topic) => (topic.task_ids || []).forEach((taskId) => ids.add(taskId)));
      workspaceTasks(index).forEach((task) => {
        if (task.topic_id && topicIds.has(task.topic_id)) ids.add(task.task_id);
      });
      return ids;
    }

    function workspaceTopicTasks(index) {
      const ids = workspaceTopicTaskIds(index);
      return workspaceTasks(index).filter((task) => ids.has(task.task_id));
    }

    function workspaceTopicForTask(index, task) {
      return workspaceTopics(index).find((topic) => workspaceTopicId(topic) === task.topic_id || (topic.task_ids || []).includes(task.task_id)) || null;
    }

    function workspaceTasksForTopic(index, topic) {
      const topicId = workspaceTopicId(topic);
      const ids = new Set(topic.task_ids || []);
      return workspaceTopicTasks(index).filter((task) => ids.has(task.task_id) || task.topic_id === topicId);
    }

    function workspaceTaskStatus(task) {
      return workspaceStatusLabels[task?.status] || "待开始";
    }

    function workspaceRefreshPlans(index) {
      project.plans = workspaceTopicTasks(index).map((task) => {
        const topic = workspaceTopicForTask(index, task);
        return {
          status: workspaceTaskStatus(task),
          title: task.title || task.task_id,
          summary: (task.content || task.done_criteria || "暂无任务说明。") + (task.task_id ? " · Task ID: " + task.task_id : ""),
          owner: task.owner || "待确认负责人",
          tag: "Topic Task",
          topic_id: workspaceTopicId(topic),
          topic_title: topic?.title || "未关联 Topic",
          task_id: task.task_id,
          task_card_id: task.task_card_id || "",
          due_date: task.due_date || task.due_at || "",
        };
      });
    }

    function workspaceEventId(event) {
      return event?.human_event_id || event?.event_id || "";
    }

    function workspaceTopicId(topic) {
      return topic?.topic_id || topic?.legacy_event_id || "";
    }

    function workspaceEventMap(index) {
      return new Map(workspaceEvents(index).map((event) => [workspaceEventId(event), event]));
    }

    function workspaceTopicMap(index) {
      return new Map(workspaceTopics(index).flatMap((topic) => {
        const id = workspaceTopicId(topic);
        return id ? [[id, topic]] : [];
      }));
    }

    function workspaceBriefings(index) {
      return Array.isArray(index?.briefings) ? index.briefings : [];
    }

    function workspaceBriefingForTopic(index, topic) {
      const ids = new Set(Array.isArray(topic?.briefing_ids) ? topic.briefing_ids : []);
      return workspaceBriefings(index).find((briefing) => briefing.topic_id === workspaceTopicId(topic) || ids.has(briefing.briefing_id)) || null;
    }

    function workspaceBriefingStatus(briefing) {
      const status = String(briefing?.status || "");
      if (status === "review_collecting") {
        const coverage = briefing.review_coverage || {};
        return `会前简报评审中：已收到 ${coverage.completed || 0}/${coverage.total || 0} 位参会成员反馈`;
      }
      if (status === "finalized_full") return "已生成最终会前简报：已综合全部参会成员反馈";
      if (status === "finalized_partial") return "已生成最终会前简报：已综合部分参会成员反馈";
      if (status === "finalized_no_response") return "已生成最终会前简报：截止时间前未收到参会成员反馈";
      if (status === "finalized_direct") return "已生成最终会前简报：直接生成，未经参会成员评审";
      return "初版会前简报已生成，等待参会成员评审";
    }

    function workspaceBriefingHeaderMarkup(briefing) {
      if (!briefing) return "";
      const final = ["finalized_full", "finalized_partial", "finalized_no_response", "finalized_direct"].includes(String(briefing.status || ""));
      const points = workspaceSummaryPointsFrom(briefing.summary_points, briefing.meeting_goal || briefing.title || "", 3);
      const status = workspaceBriefingStatus(briefing);
      const action = final
        ? `<button class="briefing-action-button" type="button" data-briefing-id="${workspaceEscape(briefing.briefing_id)}" onclick="workspaceOpenBriefing(this.dataset.briefingId,event)">已生成最终会前简报</button>`
        : `<span class="briefing-status">${workspaceEscape(status)}</span>`;
      const pointMarkup = points.length ? `<ul class="briefing-summary-points">${points.map((point) => `<li>${workspaceEscape(point)}</li>`).join("")}</ul>` : "";
      return `<div class="topic-briefing-summary">${action}${pointMarkup}</div>`;
